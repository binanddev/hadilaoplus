# Deployment template only. Creating services is a separate user action.
services:
  - type: web
    name: crown-game-api
    runtime: python
    rootDir: backend
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT crown.asgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DEBUG
        value: '0'
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: crown-game-events
          property: connectionString
  - type: keyvalue
    name: crown-game-events
    region: singapore
    plan: free
    ipAllowList: []
  - type: web
    name: crown-game
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
